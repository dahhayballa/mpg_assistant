services:
  - type: web
    name: mpg-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py import_docx_documents && gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "mpg-assistant.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: mpg-assistant-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MPG_LLM_MODEL
        value: claude-sonnet-4-6
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0

databases:
  - name: mpg-assistant-db
    databaseName: mpg_assistant
    user: mpg_assistant
