services:
  web:
    build: .
    ports:
      - "8000:8000"
    # Les clés (Anthropic, WhatsApp, Django) viennent du fichier .env local.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://mpg_assistant:${POSTGRES_PASSWORD:-mpg_assistant}@db:5432/mpg_assistant
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Tunnel public vers l'application : c'est par lui que Meta (WhatsApp) nous joint.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://web:8000
    depends_on:
      - web
    restart: unless-stopped

  # L'adresse du tunnel change à chaque démarrage : ce service la ré-enregistre chez Meta.
  register:
    build: .
    command: python register_webhook.py --watch
    env_file:
      - .env
    environment:
      TUNNEL_METRICS_URL: http://tunnel:20241
    depends_on:
      - tunnel
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mpg_assistant
      POSTGRES_USER: mpg_assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpg_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpg_assistant -d mpg_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
